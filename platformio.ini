; M5Stack PaperColor device status dashboard
; Board: PaperColor C151 / ESP32-S3R8 / 4" 400x600 Spectra 6 E-Ink

[env:m5stack-papercolor]
platform = espressif32@6.10.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

; Inject the build timestamp so an offline device can restore its RTC after
; a power-loss event without waiting for a network time source.
extra_scripts =
    pre:build_time.py

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPIN_BTN_A=10
    -DPIN_BTN_B=9
    -DPIN_BTN_C=1
    -DPIN_I2C_SDA=3
    -DPIN_I2C_SCL=2

lib_deps =
    m5stack/M5Unified @ 0.2.21
    m5stack/M5GFX @ 0.2.28
    m5stack/M5PM1 @ 1.0.7
